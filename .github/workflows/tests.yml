name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # markitdown pulls onnxruntime and magika, so the install is heavy;
          # caching keeps repeat runs to seconds.
          cache: pip
          cache-dependency-path: |
            requirements-doc2md.txt
            requirements-docsum.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-doc2md.txt -r requirements-docsum.txt
          pip install -e '.[dev]'

      - name: Run tests
        # The suite is fully mocked: no API key, no network, no cost.
        run: pytest
